server:
  port: 8080

spring:
  application:
    name: videomind-server
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:videomind}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 7
    baseline-description: pre-flyway-videomind-schema
    validate-on-migrate: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: videomind-task-producer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.videomind: debug

videomind:
  auth:
    jwt-secret: ${VIDEOMIND_JWT_SECRET}
    access-minutes: ${VIDEOMIND_ACCESS_MINUTES:15}
    refresh-days: ${VIDEOMIND_REFRESH_DAYS:30}
    token-encryption-key: ${VIDEOMIND_TOKEN_ENCRYPTION_KEY}
    frontend-url: ${VIDEOMIND_FRONTEND_URL:http://localhost:5173}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${MINIO_PRESIGN_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:videomind-videos}
  rocketmq:
    topic:
      video-analyze: videomind-video-analyze-topic
      processing-task: ${PROCESSING_TASK_TOPIC:videomind-processing-task-topic}
    consumer-group:
      video-analyze: videomind-video-analyze-consumer
      processing-task: ${PROCESSING_TASK_CONSUMER_GROUP:videomind-processing-task-consumer}
    dlq-topic:
      video-analyze: ${VIDEO_ANALYZE_DLQ_TOPIC:%DLQ%videomind-video-analyze-consumer}
    dlq-consumer-group:
      video-analyze: ${VIDEO_ANALYZE_DLQ_CONSUMER_GROUP:videomind-video-analyze-dlq-consumer}
    processing-task:
      lease-seconds: ${PROCESSING_TASK_LEASE_SECONDS:300}
      retry-delay-seconds: ${PROCESSING_TASK_RETRY_DELAY_SECONDS:10}
  ffmpeg:
    mode: ${VIDEOMIND_FFMPEG_MODE:ffmpeg}
    binary-path: ${FFMPEG_BINARY_PATH:ffmpeg}
    probe-binary-path: ${FFPROBE_BINARY_PATH:ffprobe}
    work-dir: ${FFMPEG_WORK_DIR:runtime/ffmpeg}
  knowledge:
    index-name: ${KNOWLEDGE_INDEX_NAME:idx:videomind_knowledge}
    key-prefix: ${KNOWLEDGE_KEY_PREFIX:knowledge:chunk:}
    task-status-prefix: ${KNOWLEDGE_TASK_STATUS_PREFIX:knowledge:task:}
    ttl-seconds: ${KNOWLEDGE_TTL_SECONDS:2592000}
    embedding-dim: ${KNOWLEDGE_EMBEDDING_DIM:1024}
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:600}
    chunk-overlap: ${KNOWLEDGE_CHUNK_OVERLAP:80}
  mineru:
    base-url: ${MINERU_LOCAL_BASE_URL:http://127.0.0.1:8000}
    backend: ${MINERU_LOCAL_BACKEND:pipeline}
    concurrency: ${MINERU_LOCAL_CONCURRENCY:1}
    timeout-seconds: ${MINERU_TIMEOUT_SECONDS:300}
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    url: ${ELASTICSEARCH_URL:http://localhost:9201}
    index-alias: ${ELASTICSEARCH_INDEX_ALIAS:videomind-chunks}
    physical-index: ${ELASTICSEARCH_PHYSICAL_INDEX:videomind-chunks-v1}
    dimension: ${ELASTICSEARCH_DIMENSION:1024}
    num-candidates: ${ELASTICSEARCH_NUM_CANDIDATES:200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connect-timeout-millis: ${ELASTICSEARCH_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${ELASTICSEARCH_READ_TIMEOUT_MILLIS:5000}
  upload:
    chunk-work-dir: ${UPLOAD_CHUNK_WORK_DIR:runtime/uploads}
    bitmap-prefix: ${UPLOAD_BITMAP_PREFIX:upload:bitmap:}
    bitmap-ttl-seconds: ${UPLOAD_BITMAP_TTL_SECONDS:86400}
  rate-limit:
    upload-permits-per-minute: ${UPLOAD_PERMITS_PER_MINUTE:60}
    analyze-permits-per-minute: ${ANALYZE_PERMITS_PER_MINUTE:30}
    ttl-seconds: ${RATE_LIMIT_TTL_SECONDS:600}
  ai:
    asr:
      mode: ${VIDEOMIND_ASR_MODE:real}
      endpoint: ${ASR_API_ENDPOINT:https://api.siliconflow.cn/v1/audio/transcriptions}
      api-key: "${ASR_API_KEY:${SILICONFLOW_API_KEY:}}"
      model: ${ASR_MODEL:TeleAI/TeleSpeechASR}
      timeout-seconds: ${ASR_TIMEOUT_SECONDS:300}
    summary:
      mode: ${VIDEOMIND_SUMMARY_MODE:real}
      endpoint: ${SUMMARY_API_ENDPOINT:https://api.siliconflow.cn/v1/chat/completions}
      api-key: "${SUMMARY_API_KEY:${SILICONFLOW_API_KEY:}}"
      model: ${SUMMARY_MODEL:deepseek-ai/DeepSeek-V4-Flash}
      prompt-version: ${SUMMARY_PROMPT_VERSION:summary-v3}
      timeout-seconds: ${SUMMARY_TIMEOUT_SECONDS:120}
    embedding:
      mode: ${VIDEOMIND_EMBEDDING_MODE:real}
      endpoint: ${EMBEDDING_API_ENDPOINT:https://api.siliconflow.cn/v1/embeddings}
      api-key: "${EMBEDDING_API_KEY:${SILICONFLOW_API_KEY:}}"
      model: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
      dimension: ${EMBEDDING_DIMENSION:1024}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}
    rerank:
      mode: ${VIDEOMIND_RERANK_MODE:real}
      endpoint: ${RERANK_API_ENDPOINT:https://api.siliconflow.cn/v1/rerank}
      api-key: "${RERANK_API_KEY:${SILICONFLOW_API_KEY:}}"
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      timeout-seconds: ${RERANK_TIMEOUT_SECONDS:120}
    chat:
      mode: ${VIDEOMIND_CHAT_MODE:real}
      endpoint: ${CHAT_API_ENDPOINT:https://api.siliconflow.cn/v1/chat/completions}
      api-key: "${CHAT_API_KEY:${SILICONFLOW_API_KEY:}}"
      model: ${CHAT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
      timeout-seconds: ${CHAT_TIMEOUT_SECONDS:120}
  agent:
    enabled: ${VIDEOMIND_AGENT_ENABLED:false}
    ingest-enabled: ${VIDEOMIND_AGENT_INGEST_ENABLED:false}
    chat-enabled: ${VIDEOMIND_AGENT_CHAT_ENABLED:false}
    web-search-enabled: ${VIDEOMIND_AGENT_WEB_SEARCH_ENABLED:false}
    advanced-report-enabled: ${VIDEOMIND_AGENT_ADVANCED_REPORT_ENABLED:${VIDEOMIND_AGENT_DEEP_RESEARCH_ENABLED:false}}
    presentation-enabled: ${VIDEOMIND_AGENT_PRESENTATION_ENABLED:false}
    fallback-on-error: ${VIDEOMIND_AGENT_FALLBACK_ON_ERROR:true}
    base-url: ${AGENT_PLATFORM_BASE_URL:http://localhost:8090}
    tenant-id: ${AGENT_PLATFORM_TENANT_ID:videomind}
    api-key: ${AGENT_PLATFORM_API_KEY:}
    signing-secret: ${AGENT_PLATFORM_SIGNING_SECRET:}
    webhook-secret: ${AGENT_PLATFORM_WEBHOOK_SECRET:}
    frontend-url: ${AGENT_PLATFORM_FRONTEND_URL:http://localhost:5174}
    oauth-client-id: ${AGENT_PLATFORM_OAUTH_CLIENT_ID:videomind}
    oauth-client-secret: ${AGENT_PLATFORM_OAUTH_CLIENT_SECRET:}
    oauth-redirect-uri: ${AGENT_PLATFORM_OAUTH_REDIRECT_URI:http://localhost:8080/api/integrations/mindagent/callback}
    connect-timeout-seconds: ${AGENT_PLATFORM_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${AGENT_PLATFORM_READ_TIMEOUT_SECONDS:180}
    max-retries: ${AGENT_PLATFORM_MAX_RETRIES:2}
    presigned-url-expiry-seconds: ${AGENT_PRESIGNED_URL_EXPIRY_SECONDS:900}
    task-poll-interval-seconds: ${AGENT_TASK_POLL_INTERVAL_SECONDS:5}
