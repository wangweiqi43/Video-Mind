services:
  mysql:
    image: mysql:8.0
    container_name: videomind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: videomind
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/videomind-server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: videomind-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9002:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: videomind-rocketmq-namesrv
    user: root
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: videomind-rocketmq-broker
    user: root
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m -XX:-UseContainerSupport"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: videomind-redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-stack-data:/data

volumes:
  mysql-data:
  minio-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  redis-stack-data:
