services:
  mysql:
    image: mysql/mysql-server:8.0
    container_name: videomind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: videomind
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/mysql:/var/lib/mysql"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: videomind-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9002:9001"
    command: server /data --console-address ":9001"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/minio:/data"

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: videomind-rocketmq-namesrv
    user: root
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/rocketmq/namesrv-logs:/home/rocketmq/logs"

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: videomind-rocketmq-broker
    user: root
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m -XX:-UseContainerSupport"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/rocketmq/broker-logs:/home/rocketmq/logs"
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/rocketmq/broker-store:/home/rocketmq/store"

  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: videomind-redis-stack
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
      - "8001:8001"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/redis:/data"

  redis-cache:
    image: redis:7.4-alpine
    container_name: videomind-redis-cache
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${CACHE_REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${CACHE_REDIS_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: videomind-elasticsearch:8.19.14-ik
    container_name: videomind-elasticsearch
    build:
      context: ./deploy/elasticsearch
      args:
        ELASTICSEARCH_VERSION: 8.19.14
        IK_PLUGIN_URL: ${IK_PLUGIN_URL:-https://get.infini.cloud/elasticsearch/analysis-ik/8.19.14}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9201}:9200"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/elasticsearch:/usr/share/elasticsearch/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  mineru:
    image: videomind-mineru:3.4.4-cpu
    container_name: videomind-mineru
    build:
      context: ./deploy/mineru
    init: true
    restart: unless-stopped
    environment:
      MINERU_DEVICE_MODE: cpu
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_PROCESSING_WINDOW_SIZE: "1"
      MINERU_INTRA_OP_NUM_THREADS: "1"
      MINERU_INTER_OP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/mineru:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20
