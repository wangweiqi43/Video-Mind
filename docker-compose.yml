services:
  mysql:
    image: mysql/mysql-server:8.0
    container_name: videomind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-videomind}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/mysql:/var/lib/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: videomind-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9002}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/minio:/data"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 40

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: videomind-rocketmq-namesrv
    user: root
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/rocketmq/namesrv-logs:/home/rocketmq/logs"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin getNamesrvConfig -n 127.0.0.1:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: videomind-rocketmq-broker
    user: root
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ROCKETMQ_VIP_PORT:-10909}:10909"
      - "127.0.0.1:${ROCKETMQ_BROKER_PORT:-10911}:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m -Xmn256m -XX:-UseContainerSupport"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/rocketmq/broker-logs:/home/rocketmq/logs"
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/rocketmq/broker-store:/home/rocketmq/store"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 10s
      timeout: 10s
      retries: 40

  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: videomind-redis-stack
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
      - "127.0.0.1:${REDIS_INSIGHT_PORT:-8001}:8001"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:7.4-alpine
    container_name: videomind-redis-cache
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${CACHE_REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${CACHE_REDIS_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: videomind-elasticsearch:8.19.14-ik
    container_name: videomind-elasticsearch
    build:
      context: ./deploy/elasticsearch
      args:
        ELASTICSEARCH_VERSION: 8.19.14
        IK_PLUGIN_URL: ${IK_PLUGIN_URL:-https://get.infini.cloud/elasticsearch/analysis-ik/8.19.14}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 2g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9201}:9200"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/elasticsearch:/usr/share/elasticsearch/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  mineru:
    image: videomind-mineru:3.4.4-cpu
    container_name: videomind-mineru
    build:
      context: ./deploy/mineru
    init: true
    restart: unless-stopped
    environment:
      MINERU_DEVICE_MODE: cpu
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_PROCESSING_WINDOW_SIZE: "1"
      MINERU_INTRA_OP_NUM_THREADS: "1"
      MINERU_INTER_OP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/mineru:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20

  paddleocr:
    image: videomind-paddleocr:3.7.0-cpu
    container_name: videomind-paddleocr
    build:
      context: ./deploy/paddleocr
    init: true
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: ""
      FLAGS_use_mkldnn: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OCR_DETECTION_MODEL: ${OCR_DETECTION_MODEL:-PP-OCRv5_mobile_det}
      OCR_RECOGNITION_MODEL: ${OCR_RECOGNITION_MODEL:-PP-OCRv5_mobile_rec}
      OCR_MAX_UPLOAD_BYTES: ${OCR_MAX_UPLOAD_BYTES:-20971520}
    ports:
      - "127.0.0.1:8868:8868"
    volumes:
      - "${VIDEOMIND_DATA_ROOT:-E:/VideoMindData}/paddleocr:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8868/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 900s
      retries: 40
