openapi: 3.0.3
info:
  title: VideoMind API
  version: 1.0.0-local
  description: 本地单模式 VideoMind 后端接口。详细语义见 API.md。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - accessCookie: []
tags:
  - name: Auth
  - name: Videos
  - name: Tasks
  - name: KnowledgeBases
  - name: Chat
  - name: Health
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: 注册并登录
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
  /api/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: 刷新访问令牌
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
  /api/auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: 注销并清空 Cookie
      responses:
        '200': {$ref: '#/components/responses/EmptyResponse'}
  /api/auth/me:
    get:
      tags: [Auth]
      summary: 当前用户
      responses:
        '200':
          description: 当前用户公开标识与用户名
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiResponse'}

  /api/videos/upload:
    post:
      tags: [Videos]
      summary: 上传视频
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: 上传结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoUploadApiResponse'}
  /api/videos/check-md5:
    get:
      tags: [Videos]
      summary: 检查视频 MD5
      parameters:
        - in: query
          name: fileMd5
          required: true
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/videos/multipart/init:
    post:
      tags: [Videos]
      summary: 初始化或恢复分片上传
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MultipartUploadInitRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/videos/multipart/{uploadId}/chunk:
    post:
      tags: [Videos]
      summary: 上传一个分片
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
        - in: query
          name: partNumber
          required: true
          schema: {type: integer, minimum: 1}
        - in: query
          name: chunkMd5
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/videos/multipart/{uploadId}/complete:
    post:
      tags: [Videos]
      summary: 合并并完成分片上传
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
      responses:
        '200':
          description: 完成结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoUploadApiResponse'}
  /api/videos/multipart/{uploadId}/status:
    get:
      tags: [Videos]
      summary: 查询分片上传状态
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/videos/list:
    get:
      tags: [Videos]
      summary: 视频列表
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/videos/{videoId}:
    get:
      tags: [Videos]
      summary: 视频详情
      parameters:
        - {$ref: '#/components/parameters/VideoId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
    delete:
      tags: [Videos]
      summary: 异步物理删除视频
      parameters:
        - {$ref: '#/components/parameters/VideoId'}
      responses:
        '202':
          description: 删除任务已创建或复用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionTaskApiResponse'}
  /api/videos/{videoId}/transcription:
    get:
      tags: [Videos]
      summary: 最新视频转录
      parameters:
        - {$ref: '#/components/parameters/VideoId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/videos/{videoId}/stream:
    get:
      tags: [Videos]
      summary: 读取视频文件流
      parameters:
        - {$ref: '#/components/parameters/VideoId'}
      responses:
        '200':
          description: 视频字节流
          content:
            application/octet-stream:
              schema: {type: string, format: binary}

  /api/tasks/analyze:
    post:
      tags: [Tasks]
      summary: 事务投递视频分析任务
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalyzeTaskCreateRequest'}
      responses:
        '200':
          description: 业务任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyzeTaskApiResponse'}
  /api/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 查询视频分析或物理删除任务
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/tasks/{taskId}/result:
    get:
      tags: [Tasks]
      summary: 查询视频分析结果
      parameters:
        - {$ref: '#/components/parameters/TaskId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/tasks/video/{videoId}/latest-success:
    get:
      tags: [Tasks]
      summary: 视频最近一次成功任务
      parameters:
        - {$ref: '#/components/parameters/VideoId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}

  /api/knowledge-bases:
    post:
      tags: [KnowledgeBases]
      summary: 创建用户文档知识库
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeBaseCreateRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
    get:
      tags: [KnowledgeBases]
      summary: 列出当前用户知识库
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/knowledge-bases/{knowledgeBaseId}:
    get:
      tags: [KnowledgeBases]
      summary: 知识库详情
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
    delete:
      tags: [KnowledgeBases]
      summary: 异步物理删除用户知识库
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
      responses:
        '202':
          description: 删除任务已创建或复用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionTaskApiResponse'}
  /api/knowledge-bases/{knowledgeBaseId}/documents:
    post:
      tags: [KnowledgeBases]
      summary: 上传文档并事务投递 MinerU 解析
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}

  /api/chat/session:
    post:
      tags: [Chat]
      summary: 创建固定知识库范围会话
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatSessionCreateRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/chat/session/list:
    get:
      tags: [Chat]
      summary: 指定视频的会话列表
      parameters:
        - in: query
          name: videoId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/chat/session/{sessionId}/messages:
    get:
      tags: [Chat]
      summary: 会话消息列表
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - in: query
          name: videoId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/chat/message:
    post:
      tags: [Chat]
      summary: 非流式本地 PEC 问答
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/GenericResponse'}
  /api/chat/message/stream:
    post:
      tags: [Chat]
      summary: POST SSE 流式问答
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/SseResponse'}
    get:
      tags: [Chat]
      summary: EventSource SSE 流式问答
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: {type: integer, format: int64}
        - in: query
          name: videoId
          required: true
          schema: {type: integer, format: int64}
        - in: query
          name: question
          required: true
          schema: {type: string}
        - in: query
          name: answerScope
          schema: {$ref: '#/components/schemas/AnswerScope'}
        - in: query
          name: webSearchEnabled
          schema: {type: boolean, default: false}
        - in: query
          name: deepThinkingEnabled
          schema: {type: boolean, default: false}
      responses:
        '200': {$ref: '#/components/responses/SseResponse'}
  /api/chat/generations/{generationId}/cancel:
    post:
      tags: [Chat]
      summary: 停止当前模型回答
      description: 通过 CAS 请求取消工作流并关闭上游模型响应流；重复调用幂等。
      parameters:
        - in: path
          name: generationId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: 当前生成状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatGenerationStatusApiResponse'}

  /actuator/health:
    get:
      tags: [Health]
      security: []
      summary: 服务健康检查
      responses:
        '200':
          description: 健康状态

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: VM_ACCESS
  parameters:
    VideoId:
      in: path
      name: videoId
      required: true
      schema: {type: integer, format: int64}
    TaskId:
      in: path
      name: taskId
      required: true
      schema: {type: integer, format: int64}
    UploadId:
      in: path
      name: uploadId
      required: true
      schema: {type: string}
    KnowledgeBaseId:
      in: path
      name: knowledgeBaseId
      required: true
      schema: {type: integer, format: int64}
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: {type: integer, format: int64}
  responses:
    GenericResponse:
      description: 统一业务响应；具体 data 见 API.md
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
    EmptyResponse:
      description: 成功且 data 为空
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
    AuthResponse:
      description: 登录态与访问令牌
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
    SseResponse:
      description: generation/workflow/delta/done/cancelled/error 事件流
      content:
        text/event-stream:
          schema:
            type: string
            example: "event:generation\ndata:{\"generationId\":61,\"status\":\"RUNNING\"}\n\n"
  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: integer, example: 0}
        message: {type: string, example: success}
        data: {nullable: true}
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 8, maxLength: 128, format: password}
    VideoUploadApiResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/VideoUploadResponse'}
    VideoUploadResponse:
      type: object
      properties:
        videoId: {type: integer, format: int64}
        filename: {type: string}
        fileMd5: {type: string}
        fileSize: {type: integer, format: int64}
        bucket: {type: string}
        objectKey: {type: string}
        implemented: {type: boolean}
        duplicate: {type: boolean}
        serverMd5CostMs: {type: integer, format: int64}
        serverMergeCostMs: {type: integer, format: int64}
        serverStorageCostMs: {type: integer, format: int64}
        serverTotalCostMs: {type: integer, format: int64}
        message: {type: string}
    MultipartUploadInitRequest:
      type: object
      required: [filename, fileMd5, fileSize, totalParts, chunkSize]
      properties:
        filename: {type: string}
        fileMd5: {type: string}
        fileSize: {type: integer, format: int64, minimum: 1}
        contentType: {type: string}
        totalParts: {type: integer, minimum: 1}
        chunkSize: {type: integer, format: int64, minimum: 1}
    AnalyzeTaskCreateRequest:
      type: object
      required: [videoId]
      properties:
        videoId: {type: integer, format: int64}
    AnalyzeTaskApiResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              type: object
              properties:
                taskId: {type: integer, format: int64}
                status: {$ref: '#/components/schemas/TaskStatus'}
                reused: {type: boolean}
    DeletionTaskApiResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              type: object
              properties:
                eventId: {type: string}
                taskId: {type: integer, format: int64}
                status: {$ref: '#/components/schemas/ProcessingTaskState'}
    KnowledgeBaseCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    ChatSessionCreateRequest:
      type: object
      required: [videoId]
      properties:
        videoId: {type: integer, format: int64}
        knowledgeBaseIds:
          type: array
          maxItems: 20
          items: {type: integer, format: int64}
          default: []
    ChatMessageRequest:
      type: object
      required: [sessionId, videoId, question]
      properties:
        sessionId: {type: integer, format: int64}
        videoId: {type: integer, format: int64}
        question: {type: string, minLength: 1}
        answerScope: {$ref: '#/components/schemas/AnswerScope'}
        webSearchEnabled: {type: boolean, default: false}
        deepThinkingEnabled: {type: boolean, default: false}
    ChatGenerationStatusApiResponse:
      allOf:
        - {$ref: '#/components/schemas/ApiResponse'}
        - type: object
          properties:
            data:
              type: object
              properties:
                generationId: {type: integer, format: int64}
                status:
                  type: string
                  enum: [RUNNING, CANCEL_REQUESTED, CANCELLED, SUCCESS, FAILED]
    AnswerScope:
      type: string
      enum: [KNOWLEDGE_ONLY, KNOWLEDGE_EXTENDED]
      default: KNOWLEDGE_EXTENDED
    TaskStatus:
      type: string
      enum: [PENDING, PROCESSING, RETRYING, CANCEL_REQUESTED, CANCELLED, SUCCESS, FAILED]
    ProcessingTaskState:
      type: string
      enum: [PENDING, PROCESSING, RETRY_WAIT, CANCEL_REQUESTED, CANCELLED, SUCCESS, FAILED, DEAD]
